<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 妖币雷达 V2 · 可调数量 + 跳转 + 数据详解</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            background: #0b0e14;
            color: #e5e9f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
            min-height: 100vh;
        }
        .container { max-width: 1500px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid #2a2f3a;
            padding-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            background: linear-gradient(135deg, #f7b731, #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .sub { font-size: 13px; color: #8a8f99; -webkit-text-fill-color: #8a8f99; margin-left: 6px; }
        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #161b24;
            padding: 4px 12px 4px 16px;
            border-radius: 30px;
            border: 1px solid #252b36;
        }
        .control-group label {
            font-size: 13px;
            color: #b0b7c4;
        }
        .control-group input[type="number"] {
            width: 60px;
            padding: 4px 6px;
            background: #0b0e14;
            border: 1px solid #3a4050;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            text-align: center;
        }
        .control-group input[type="number"]:focus {
            outline: none;
            border-color: #f5a623;
        }
        .btn {
            background: #2a2f3a;
            border: none;
            color: #fff;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn:hover { background: #3a4050; }
        .btn-primary { background: #f5a623; color: #0b0e14; }
        .btn-primary:hover { background: #f7c35c; }
        .btn:disabled { opacity: 0.4; pointer-events: none; }
        .stats {
            font-size: 13px;
            background: #161b24;
            padding: 5px 14px;
            border-radius: 20px;
            color: #b0b7c4;
            border: 1px solid #252b36;
        }
        .stats span { color: #f7b731; font-weight: 700; }
        .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid #1e232e; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 900px;
        }
        th {
            background: #141a24;
            text-align: left;
            padding: 11px 12px;
            font-weight: 600;
            color: #a8b0c0;
            border-bottom: 2px solid #262d3a;
            white-space: nowrap;
        }
        td {
            padding: 9px 12px;
            border-bottom: 1px solid #1a202a;
            vertical-align: middle;
        }
        tr:hover td { background: #141b26; }
        .symbol-link {
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .symbol-link:hover {
            color: #f5a623;
            text-decoration: underline;
        }
        .score {
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 30px;
            display: inline-block;
            font-size: 13px;
            min-width: 36px;
            text-align: center;
        }
        .score-high { background: #e74c3c; color: #fff; }
        .score-mid { background: #f39c12; color: #000; }
        .score-low { background: #2d3748; color: #b0b7c4; }
        .tag {
            display: inline-block;
            background: #1e2a3a;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #b0c4de;
            margin: 2px 4px 2px 0;
            white-space: nowrap;
        }
        .tag .detail {
            color: #f5c542;
            font-weight: 600;
            margin-left: 4px;
        }
        .tag-green { background: #1a3a2a; color: #6fcf97; }
        .tag-red { background: #3a1a1a; color: #f28b82; }
        .tag-gold { background: #3a2f1a; color: #f5c542; }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6b7a8f;
        }
        .loading .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #2a2f3a;
            border-top: 3px solid #f5a623;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error {
            background: #2a1215;
            border: 1px solid #5c1a1a;
            padding: 12px 18px;
            border-radius: 8px;
            color: #f5a3a3;
            margin: 12px 0;
            word-break: break-word;
        }
        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #4a5363;
            text-align: center;
            border-top: 1px solid #1e232e;
            padding-top: 18px;
        }
        .progress-bar {
            height: 2px;
            background: #1e232e;
            border-radius: 4px;
            margin: 6px 0 16px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f5a623, #e74c3c);
            transition: width 0.3s;
        }
        .meta-info { font-size: 12px; color: #5a6377; margin-left: 12px; }
        @media (max-width: 700px) {
            h1 { font-size: 18px; }
            .controls { gap: 8px; }
            .control-group { padding: 4px 8px; }
            .control-group input[type="number"] { width: 50px; }
            .btn { padding: 6px 14px; font-size: 13px; }
            .stats { font-size: 11px; padding: 4px 10px; }
            td, th { padding: 6px 8px; font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div>
            <h1>⚡ 妖币雷达 <span class="sub">· V2 数据详解版</span></h1>
        </div>
        <div class="controls">
            <div class="control-group">
                <label for="limitInput">📊 数量</label>
                <input type="number" id="limitInput" value="45" min="10" max="100" step="5">
            </div>
            <span class="stats" id="statsInfo">🟢 就绪</span>
            <button class="btn btn-primary" id="scanBtn" onclick="startScan()">🔎 开始扫描</button>
        </div>
    </header>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="errorBox"></div>
    <div id="resultArea">
        <div class="loading">
            <div class="spinner"></div>
            <div>点击「开始扫描」检测全市场吸筹信号</div>
            <div style="font-size:12px; color:#4a5363; margin-top:8px;">可调整数量，点击交易对跳转币安合约</div>
        </div>
    </div>
    <div class="footer">
        ⚠️ 信号仅供参考，不构成投资建议 · 合约交易风险极高，请谨慎操作
    </div>
</div>
<script>
    // --------------------------------------------------------------
    // 1. 核心配置
    // --------------------------------------------------------------
    const BASE = 'https://fapi.binance.com';
    const MIN_VOLUME_USD = 1_800_000;
    const CONCURRENCY = 5;
    const REQ_TIMEOUT = 8000;

    const WEIGHTS = {
        CONSOLIDATION: 30,
        POSITION: 20,
        FUNDING: 20,
        VOLUME: 15,
        OI_GROWTH: 15
    };

    // --------------------------------------------------------------
    // 2. DOM 引用
    // --------------------------------------------------------------
    const resultArea = document.getElementById('resultArea');
    const errorBox = document.getElementById('errorBox');
    const scanBtn = document.getElementById('scanBtn');
    const statsInfo = document.getElementById('statsInfo');
    const progressFill = document.getElementById('progressFill');
    const limitInput = document.getElementById('limitInput');

    // --------------------------------------------------------------
    // 3. 工具函数
    // --------------------------------------------------------------
    function setError(msg) {
        errorBox.innerHTML = msg ? `<div class="error">⚠️ ${msg}</div>` : '';
    }

    function setProgress(pct) {
        progressFill.style.width = `${Math.min(100, pct)}%`;
    }

    function setStats(text, isOk = true) {
        statsInfo.innerHTML = text;
        statsInfo.style.color = isOk ? '#b0b7c4' : '#f5a3a3';
    }

    function timeoutFetch(url, ms = REQ_TIMEOUT) {
        return Promise.race([
            fetch(url),
            new Promise((_, reject) => setTimeout(() => reject(new Error('请求超时，请检查网络')), ms))
        ]);
    }

    async function fetchJson(url) {
        const res = await timeoutFetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
        return res.json();
    }

    async function asyncPool(poolLimit, array, iteratorFn) {
        const ret = [];
        const executing = [];
        for (const item of array) {
            const p = Promise.resolve().then(() => iteratorFn(item, array));
            ret.push(p);
            if (poolLimit <= array.length) {
                const e = p.then(() => executing.splice(executing.indexOf(e), 1));
                executing.push(e);
                if (executing.length >= poolLimit) await Promise.race(executing);
            }
        }
        return Promise.all(ret);
    }

    // --------------------------------------------------------------
    // 4. API 数据采集
    // --------------------------------------------------------------
    async function fetchAllTickers() {
        const data = await fetchJson(`${BASE}/fapi/v1/ticker/24hr`);
        return data.filter(item => 
            item.symbol.endsWith('USDT') && 
            parseFloat(item.quoteVolume) >= MIN_VOLUME_USD
        );
    }

    async function fetchFundingRates() {
        const data = await fetchJson(`${BASE}/fapi/v1/premiumIndex`);
        const map = {};
        data.forEach(item => { map[item.symbol] = parseFloat(item.lastFundingRate); });
        return map;
    }

    async function fetchKlines(symbol) {
        try {
            const url = `${BASE}/fapi/v1/klines?symbol=${symbol}&interval=1d&limit=30`;
            const data = await fetchJson(url);
            return data.map(k => ({
                high: parseFloat(k[2]),
                low: parseFloat(k[3]),
                close: parseFloat(k[4]),
                volume: parseFloat(k[5])
            }));
        } catch { return null; }
    }

    async function fetchCurrentOI(symbol) {
        try {
            const data = await fetchJson(`${BASE}/fapi/v1/openInterest?symbol=${symbol}`);
            return parseFloat(data.openInterest);
        } catch { return 0; }
    }

    async function fetchOIGrowth(symbol) {
        try {
            const now = Date.now();
            const url = `${BASE}/futures/data/openInterestHist?symbol=${symbol}&period=1h&limit=2&endTime=${now}`;
            const data = await fetchJson(url);
            if (data.length < 2) return 0;
            const prev = parseFloat(data[0].sumOpenInterestValue);
            const curr = parseFloat(data[1].sumOpenInterestValue);
            if (prev === 0) return 0;
            return (curr - prev) / prev;
        } catch { return 0; }
    }

    // --------------------------------------------------------------
    // 5. 评分算法 (返回分数 + 详细指标)
    // --------------------------------------------------------------
    function calcConsolidation(klines) {
        if (!klines || klines.length < 20) return { score: 0, cv: 0 };
        const closes = klines.map(k => k.close);
        const mean = closes.reduce((a,b) => a+b, 0) / closes.length;
        if (mean === 0) return { score: 0, cv: 0 };
        const std = Math.sqrt(closes.reduce((s, v) => s + (v - mean) ** 2, 0) / closes.length);
        const cv = std / mean;
        const score = Math.max(0, Math.min(100, (0.15 - cv) / 0.11 * 100));
        return { score: score * (WEIGHTS.CONSOLIDATION / 100), cv };
    }

    function calcPosition(klines, currentPrice) {
        if (!klines || klines.length < 20 || !currentPrice) return { score: 0, ratio: 0.5 };
        const highs = klines.map(k => k.high);
        const lows = klines.map(k => k.low);
        const high = Math.max(...highs);
        const low = Math.min(...lows);
        if (high === low) return { score: WEIGHTS.POSITION, ratio: 0 };
        const ratio = (currentPrice - low) / (high - low);
        const score = Math.max(0, Math.min(100, (0.7 - ratio) / 0.4 * 100));
        return { score: score * (WEIGHTS.POSITION / 100), ratio };
    }

    function calcFunding(fundingRate) {
        if (fundingRate === undefined || fundingRate === null) return { score: 0, rate: 0 };
        const rate = Math.min(0, fundingRate);
        const score = Math.max(0, Math.min(100, (-rate - 0.00005) / 0.0001 * 100));
        return { score: score * (WEIGHTS.FUNDING / 100), rate: fundingRate };
    }

    function calcVolume(quoteVolume) {
        const vol = parseFloat(quoteVolume);
        if (vol < MIN_VOLUME_USD) return { score: 0, volume: vol };
        const score = Math.min(100, (Math.log10(vol / 1_000_000) / 2) * 100);
        return { score: Math.max(0, score) * (WEIGHTS.VOLUME / 100), volume: vol };
    }

    function calcOI(oiGrowth) {
        if (!oiGrowth || oiGrowth < 0) return { score: 0, growth: 0 };
        const score = Math.min(100, (oiGrowth - 0.02) / 0.08 * 100);
        return { score: Math.max(0, score) * (WEIGHTS.OI_GROWTH / 100), growth: oiGrowth };
    }

    // --------------------------------------------------------------
    // 6. 主扫描引擎
    // --------------------------------------------------------------
    async function startScan() {
        // 读取用户设置的数量
        let limit = parseInt(limitInput.value);
        if (isNaN(limit) || limit < 10) limit = 10;
        if (limit > 100) limit = 100;
        limitInput.value = limit;

        setError('');
        scanBtn.disabled = true;
        resultArea.innerHTML = `<div class="loading"><div class="spinner"></div><div>⏳ 正在扫描前 ${limit} 个高流动性合约，请稍候...</div></div>`;
        setProgress(5);
        setStats('📡 加载数据中...');

        try {
            // Step 1: Ticker
            const allTickers = await fetchAllTickers();
            if (allTickers.length === 0) throw new Error('未获取到有效交易对，请检查网络代理');
            setProgress(15);
            setStats(`📊 已筛选 ${allTickers.length} 个活跃交易对`);

            const sorted = allTickers.sort((a,b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume));
            const candidates = sorted.slice(0, limit);
            setStats(`🎯 聚焦前 ${candidates.length} 个高流动性标的`);

            // Step 2: 资金费率
            const fundingMap = await fetchFundingRates();
            setProgress(25);

            // Step 3: 并发分析
            const symbols = candidates.map(item => item.symbol);
            const total = symbols.length;
            let completed = 0;

            const results = await asyncPool(CONCURRENCY, symbols, async (symbol) => {
                const ticker = candidates.find(t => t.symbol === symbol);
                if (!ticker) return null;

                const [klines, currentOI, oiGrowth] = await Promise.all([
                    fetchKlines(symbol),
                    fetchCurrentOI(symbol),
                    fetchOIGrowth(symbol)
                ]);

                completed++;
                const pct = 25 + (completed / total) * 70;
                setProgress(pct);
                setStats(`⏳ 分析中 ${completed}/${total} ...`);

                const currentPrice = parseFloat(ticker.lastPrice);
                const cons = calcConsolidation(klines);
                const pos = calcPosition(klines, currentPrice);
                const fund = calcFunding(fundingMap[symbol]);
                const vol = calcVolume(ticker.quoteVolume);
                const oi = calcOI(oiGrowth);

                const totalScore = cons.score + pos.score + fund.score + vol.score + oi.score;

                // 构建特征标签（含详细数据）
                const tags = [];
                if (cons.score > 20) tags.push({ label: '📦 横盘', detail: `CV=${cons.cv.toFixed(3)}` });
                if (pos.score > 15) tags.push({ label: '⬇️ 低位', detail: `位置=${pos.ratio.toFixed(2)}` });
                if (fund.score > 15) tags.push({ label: '🔥 负费率', detail: `${(fund.rate * 100).toFixed(3)}%` });
                if (oi.score > 10) tags.push({ label: '📈 OI增长', detail: `${(oi.growth * 100).toFixed(1)}%` });
                if (tags.length === 0) tags.push({ label: '⏳ 观望', detail: '' });

                return {
                    symbol,
                    price: currentPrice,
                    change24: parseFloat(ticker.priceChangePercent),
                    volume: parseFloat(ticker.quoteVolume),
                    funding: fund.rate,
                    oiGrowth: oi.growth,
                    totalScore,
                    tags,
                    // 保留原始得分用于排序
                    consScore: cons.score,
                    posScore: pos.score,
                    fundScore: fund.score,
                    volScore: vol.score,
                    oiScore: oi.score
                };
            });

            const valid = results.filter(r => r !== null && r.totalScore > 0);
            valid.sort((a,b) => b.totalScore - a.totalScore);

            setProgress(100);
            setStats(`✅ 扫描完成 · 发现 ${valid.length} 个异动信号`);

            renderResults(valid);

        } catch (err) {
            console.error(err);
            setError(`扫描出错: ${err.message || '网络异常，请刷新后重试'}`);
            resultArea.innerHTML = `<div class="loading">❌ 加载失败，请检查网络环境</div>`;
        } finally {
            scanBtn.disabled = false;
            setProgress(100);
        }
    }

    // --------------------------------------------------------------
    // 7. 渲染结果
    // --------------------------------------------------------------
    function renderResults(data) {
        if (!data || data.length === 0) {
            resultArea.innerHTML = `<div class="loading">😴 未检测到明显的吸筹信号，过段时间再扫</div>`;
            return;
        }

        const top = data.slice(0, 50); // 最多展示50个
        let html = `
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>交易对</th>
                            <th>价格</th>
                            <th>24h 涨跌</th>
                            <th>成交额</th>
                            <th>资金费率</th>
                            <th>OI 1h变</th>
                            <th>综合评分</th>
                            <th>特征标签（含数据）</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        top.forEach((item, idx) => {
            const score = item.totalScore;
            let scoreClass = 'score-low';
            if (score > 60) scoreClass = 'score-high';
            else if (score > 40) scoreClass = 'score-mid';

            const change = item.change24;
            const changeColor = change > 0 ? '#6fcf97' : '#f28b82';
            const funding = (item.funding * 100).toFixed(3) + '%';
            const oiStr = (item.oiGrowth * 100).toFixed(1) + '%';

            // 构造跳转链接
            const binanceUrl = `https://www.binance.com/zh-CN/futures/${item.symbol}`;

            // 构造标签HTML（包含详细数据）
            const tagsHtml = item.tags.map(t => {
                if (t.detail) {
                    return `<span class="tag tag-gold">${t.label} <span class="detail">${t.detail}</span></span>`;
                } else {
                    return `<span class="tag tag-gold">${t.label}</span>`;
                }
            }).join(' ');

            html += `
                <tr>
                    <td>${idx + 1}</td>
                    <td><a href="${binanceUrl}" target="_blank" class="symbol-link">${item.symbol}</a></td>
                    <td>${item.price.toFixed(4)}</td>
                    <td style="color:${changeColor};">${change > 0 ? '+' : ''}${change.toFixed(2)}%</td>
                    <td>$${(item.volume / 1_000_000).toFixed(1)}M</td>
                    <td style="color:${item.funding < 0 ? '#6fcf97' : '#b0b7c4'};">${funding}</td>
                    <td style="color:${item.oiGrowth > 0.03 ? '#6fcf97' : '#b0b7c4'};">${oiStr}</td>
                    <td><span class="score ${scoreClass}">${Math.round(score)}</span></td>
                    <td>${tagsHtml}</td>
                </tr>
            `;
        });

        html += `</tbody></table></div>`;
        html += `<div style="margin-top:10px;font-size:12px;color:#4a5363;">
            ✅ 点击交易对跳转币安合约 · 标签中 <span class="detail" style="color:#f5c542;">黄色数字</span> 为具体指标（CV越小越横盘，位置越小越低，费率越负越好，OI增长越高越好）
        </div>`;
        resultArea.innerHTML = html;
    }

    // 页面加载完成
    document.addEventListener('DOMContentLoaded', () => {
        setStats('🟢 就绪，点击扫描');
    });
</script>
</body>
</html>
